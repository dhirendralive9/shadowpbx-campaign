;==============================================================
; Answering-machine detection.
;
; AMD() listens to the first few seconds after answer and guesses whether it
; heard a person or a voicemail greeting. It is a guess. Tune it by watching
; the report: too many real people marked MACHINE means the thresholds are
; too aggressive, and that is the expensive mistake -- a dropped lead costs
; more than a few seconds wasted on a machine.
;
; Every second spent analysing is a second of silence the human hears before
; the prompt starts, so total_analysis_time is the dial between accuracy and
; people saying "hello? hello?" and hanging up.
;==============================================================
[general]
; Silence after answer before it is called a machine. Voicemail usually starts
; talking at once; a person says "hello" then waits.
initial_silence = 2500

; A single continuous sound longer than this is a greeting, not a "hello".
greeting = 1500

; Silence after that sound. A person stops and waits for an answer; a
; voicemail greeting runs into the beep.
after_greeting_silence = 800

; Hard ceiling on the whole analysis. 4s keeps the wait tolerable for humans.
; Raising it improves accuracy and makes every answered call feel slower.
total_analysis_time = 4000

min_word_length = 100
between_words_silence = 50
maximum_number_of_words = 3
maximum_word_length = 5000
silence_threshold = 256
