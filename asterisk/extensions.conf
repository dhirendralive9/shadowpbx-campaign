;==============================================================
; Minimal dialplan. The ARI app owns the call flow, so these
; contexts only hand channels into Stasis.
;==============================================================

[general]
static = yes
writeprotect = no

[from-trunk]
; Inbound from the carrier (not used for outbound campaigns, but
; keeps unexpected inbound calls from falling through to nothing).
exten => _.,1,NoOp(Inbound from trunk: ${CALLERID(num)} -> ${EXTEN})
 same => n,Hangup()

[from-pbx]
; Inbound from the main ShadowPBX, if you ever route back this way.
exten => _.,1,NoOp(Inbound from ShadowPBX: ${EXTEN})
 same => n,Hangup()

[campaign-out]
; Everything the campaign originates lands in the Stasis app.
exten => _.,1,NoOp(Campaign outbound -> Stasis)
 same => n,Stasis(shadowpbx-campaign)
 same => n,Hangup()

[dtmf-test]
; CLI proof of trunk + audio + DTMF, no ARI app needed:
;   asterisk -rx "channel originate PJSIP/+<number>@<trunk-endpoint> extension s@dtmf-test"
; Plays the bundled campaign/test sound, waits 8s for one key, logs the result.
exten => s,1,Answer()
 same => n,Set(GOT=)
 same => n,Read(GOT,campaign/test,1,,1,8)
 same => n,Verbose(1,DTMF RESULT: "${GOT}")
 same => n,GotoIf($["${GOT}"="1"]?ok:fail)
 same => n(ok),Verbose(1,SUCCESS - key 1 received)
 same => n,Hangup()
 same => n(fail),Verbose(1,FAILED - got "${GOT}" (empty = nothing received))
 same => n,Hangup()

[campaign-echo]
; Two-way audio proof for the hand-off leg. Playback only shows that audio
; reaches the agent; echo shows that the agent's audio comes back as well --
; one-way audio after a transfer is a far more common failure than silence.
exten => s,1,NoOp(Campaign echo test)
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()
