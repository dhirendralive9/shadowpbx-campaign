; ARI needs the built-in HTTP server. Bound to localhost only —
; the Node app runs on the same box, so nothing is exposed publicly.
[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
; Asterisk's default is 100 concurrent HTTP sessions. Every live call makes
; ARI requests (originate, answer, playback, a channel check every 2s), so a
; busy campaign can hit that ceiling and ARI requests then stall -- which is
; exactly what leaves calls stuck in "dialing".
sessionlimit = 1000
