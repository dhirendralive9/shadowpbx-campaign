;==============================================================
; ShadowPBX Campaign — placeholder pjsip.conf
;
; This file deliberately contains NO trunks.
;
; Trunks and servers are defined in the UI (Settings -> Trunks). Saving
; there REWRITES this file in full and reloads PJSIP, so anything added by
; hand is lost on the next save.
;
; A sample trunk used to live here. It pointed at a host that does not
; exist, so a fresh install spent forever logging
;   "No response received from 'sip:sip.yourprovider.de' ... retrying in 60"
; which buried the real errors. An empty transport is the honest state of a
; machine with no trunk configured yet.
;==============================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
