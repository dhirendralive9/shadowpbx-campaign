;==============================================================
; ShadowPBX Campaign Module — PJSIP
;
; Two endpoints:
;   german-trunk  -> your outbound VoIP provider (dials the leads)
;   shadowpbx     -> your main PBX (where press-1 calls are sent)
;
; Two settings here are load-bearing; do not "tidy" them away:
;   allow = ulaw,alaw   -> G.711 only. G.729 is what made the prompt
;                          inaudible and the recordings pure static.
;   dtmf_mode = auto    -> accepts RFC2833 AND falls back to in-band
;                          tone detection, so a carrier that refuses to
;                          negotiate telephone-event no longer breaks press-1.
;==============================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; If the box is behind NAT, uncomment and set these:
; external_media_address = YOUR_PUBLIC_IP
; external_signaling_address = YOUR_PUBLIC_IP
; local_net = 10.0.0.0/8

;--------------------------------------------------------------
; German VoIP trunk (outbound to leads)
;--------------------------------------------------------------
[german-trunk]
type = registration
transport = transport-udp
outbound_auth = german-trunk-auth
server_uri = sip:${TRUNK_HOST}
client_uri = sip:${TRUNK_USER}@${TRUNK_HOST}
retry_interval = 60
forbidden_retry_interval = 600
expiration = 3600

[german-trunk-auth]
type = auth
auth_type = userpass
username = ${TRUNK_USER}
password = ${TRUNK_PASS}

[german-trunk]
type = aor
contact = sip:${TRUNK_HOST}
qualify_frequency = 60

[german-trunk]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw,alaw
outbound_auth = german-trunk-auth
aors = german-trunk
from_user = ${TRUNK_USER}
from_domain = ${TRUNK_HOST}
dtmf_mode = auto
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
trust_id_outbound = yes

[german-trunk]
type = identify
endpoint = german-trunk
match = ${TRUNK_HOST}

;--------------------------------------------------------------
; Main ShadowPBX (press-1 transfer target)
; IP-based trust, no registration. Lock this down to its IP.
;--------------------------------------------------------------
[shadowpbx]
type = aor
contact = sip:${PBX_HOST}:${PBX_PORT}
qualify_frequency = 60

[shadowpbx]
type = endpoint
transport = transport-udp
context = from-pbx
disallow = all
allow = ulaw,alaw
aors = shadowpbx
dtmf_mode = auto
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Custom headers (X-Lead-Id etc.) are added per-call by the ARI app.

[shadowpbx]
type = identify
endpoint = shadowpbx
match = ${PBX_HOST}
